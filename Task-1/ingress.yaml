apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mlops-nginx-ingress
  namespace: default
  annotations:
    ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mlops-nginx-service
            port:
              number: 80
